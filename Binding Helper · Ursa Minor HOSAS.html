<head>

<title>Binding Helper · Ursa Minor HOSAS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;600;700&display=swap">
<style>
:root{--bg:#e8ecef;--panel:#f7f9fa;--ink:#1c2a35;--mute:#5d6e7b;--line:#c3ccd3;--acc:#d9531e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151d24;--panel:#1d2831;--ink:#e6edf2;--mute:#8fa1ae;--line:#34444f;--acc:#ff7a45;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151d24;--panel:#1d2831;--ink:#e6edf2;--mute:#8fa1ae;--line:#34444f;--acc:#ff7a45;color-scheme:dark}
html{height:100%}*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.4 "Barlow Semi Condensed",system-ui,sans-serif;padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}
main{max-width:1700px;margin:0 auto;padding:12px}
h1{font-size:21px;font-weight:700;margin:0}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
button,label.file,select{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 12px;border-radius:6px;cursor:pointer}
button:hover,label.file:hover{border-color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input[type=file]{position:absolute;opacity:0;width:1px;height:1px}
#msg{color:var(--mute);font-size:14px}
details{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-bottom:10px}
summary{cursor:pointer;font-weight:600}
.cols{display:grid;grid-template-columns:minmax(260px,1fr) minmax(300px,2fr);gap:16px;margin-top:8px}
.cr{display:flex;gap:6px;align-items:center;margin:4px 0}
.cr input[type=text]{flex:1;min-width:0}
input[type=color]{width:34px;height:30px;padding:0;border:1px solid var(--line);border-radius:6px;background:none}
input[type=text],textarea{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
textarea{width:100%;min-height:150px;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:#fff}
.stage{position:relative;min-width:1300px;container-type:inline-size;line-height:0;color:#111}
.stage>img{width:100%;display:block}
.b{position:absolute;display:flex;align-items:center;gap:.25cqw;padding:0 .3cqw;background:#fff;border:.14cqw solid var(--c);color:var(--c);cursor:pointer;overflow:hidden;line-height:1;white-space:nowrap}
.b:hover,.b.sel,.d:hover,.d.sel{box-shadow:0 0 0 .22cqw var(--acc);z-index:3}
.n{font-weight:700;font-size:.9cqw;flex:none}
.t{flex:1;min-width:0;align-self:stretch;overflow:hidden;display:flex;align-items:center;font-weight:600;color:var(--c);line-height:1.05}
.t span{min-width:0}
.d{position:absolute;width:1.4cqw;height:1.4cqw;margin:-.7cqw 0 0 -.7cqw;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font:700 .72cqw/1 inherit;cursor:pointer;z-index:2}
.h{position:absolute;border:0;background:transparent;font:600 1.5cqw "Barlow Semi Condensed",sans-serif;color:#111;padding:0 .5cqw;line-height:normal}
#ed{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:2px solid var(--acc);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;z-index:10}
#who{font-weight:700;min-width:150px}
.cb{position:relative}
#fn{width:min(340px,70vw)}
#dd{position:absolute;bottom:100%;left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:6px;max-height:260px;overflow:auto;display:none;margin-bottom:4px;box-shadow:0 4px 14px #0003}
#dd div{padding:5px 10px;cursor:pointer;display:flex;gap:8px;align-items:center}
#dd div.on,#dd div:hover{background:var(--acc);color:#fff}
#dd i{width:10px;height:10px;border-radius:50%;flex:none}
</style>
</head>
